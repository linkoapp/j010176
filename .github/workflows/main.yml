name: Linko Puzzle 140 Impossible Solver

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      server_id:
        description: 'Enter Server Number (1 to 200)'
        required: true
        default: '1'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coincurve bit base58 requests

    - name: Run Puzzle 140 Impossible Solver Node
      run: |
        python linko_puzzle_140_impossible_solver.py
